name: Flaky Detective (GitHub Actions history)

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: flaky
        name: Classify using native Actions history
        uses: JevForge/jev-flaky-detective@v0
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          results_path: .jev/current-results.json
          fetch_github_history: 'true'
          history_lookback: '20'
          workflow_name: CI
          create_check_run: 'true'
          comment_on_github: 'false'

      - name: Show evidence summary
        if: always()
        run: echo '${{ steps.flaky.outputs.evidence_summary }}'
