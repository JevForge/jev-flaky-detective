name: Flaky Detective (JUnit)

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  test-and-classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (produce JUnit)
        id: tests
        continue-on-error: true
        run: |
          mkdir -p reports
          # Replace with your real test command that writes reports/junit.xml
          echo '<?xml version="1.0"?><testsuite name="demo"><testcase classname="Demo" name="example" time="0.01"><failure message="demo failure">stack</failure></testcase></testsuite>' > reports/junit.xml

      - id: flaky
        if: always()
        uses: JevForge/jev-flaky-detective@v0
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          junit_path: reports/**/*.xml
          history_path: .jev/test-history.json
          create_check_run: 'true'
          low_confidence_policy: warn
          dry_run: 'true'

      - name: Use failure_type
        if: always()
        run: echo "Primary classification is ${{ steps.flaky.outputs.failure_type }}"
